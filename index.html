<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LTX — The world model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --retake-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);
      --glass-x: 24%;
      --glass-y: 8%;
      --cap-left: -5px;
      --cap-width: calc(20% + 5px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Manrope', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.2);
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    /* ─── Media Layer (z-index 0) ─── */
    .media-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      visibility: hidden;
    }

    .media.active {
      visibility: visible;
    }

    /* ─── Hero Copy (z-index 10) ─── */
    .hero {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .hero-title {
      position: absolute;
      top: 35.9%;
      left: 50%;
      transform: translateX(-50%);
      width: min(901px, calc(100vw - 48px));
      font-size: clamp(62px, 6.8vw, 100px);
      font-weight: 500;
      line-height: 0.8;
      letter-spacing: -0.04em;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.14);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .hero-title span {
      display: inline-block;
      transition: opacity 900ms var(--retake-ease),
                  filter 900ms var(--retake-ease),
                  transform 900ms var(--retake-ease);
      opacity: 1;
      filter: blur(0);
      transform: translateY(0);
    }

    .hero-title span:nth-child(1) { transition-delay: 0ms; }
    .hero-title span:nth-child(2) { transition-delay: 90ms; }
    .hero-title span:nth-child(3) { transition-delay: 180ms; }

    .stage.title-hidden .hero-title span {
      opacity: 0;
      filter: blur(12px);
      transform: translateY(-10px);
    }

    .hero-desc {
      position: absolute;
      top: calc(46.78% + 94px);
      left: 50%;
      transform: translateX(-50%);
      width: min(734px, calc(100vw - 48px));
      font-size: clamp(14px, 1.25vw, 18px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.04em;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.16);
      text-align: center;
      color: #fff;
      pointer-events: none;
    }

    /* ─── Controller (z-index 20) ─── */
    .controller {
      position: absolute;
      top: 46.78%;
      left: 50%;
      transform: translateX(-50%);
      width: min(880px, calc(100vw - 48px));
      height: 72px;
      z-index: 20;
    }

    /* Glass Materials */
    .track {
      position: absolute;
      top: 4px;
      left: 0;
      width: 100%;
      height: 64px;
      border-radius: 999px;
      background: rgba(24, 55, 82, 0.31);
      border: 1px solid rgba(255, 255, 255, 0.2);
      -webkit-backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
      backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
      box-shadow:
        0 14px 38px rgba(4, 24, 43, 0.16),
        0 2px 7px rgba(4, 24, 43, 0.1),
        inset 1px 1px 0 rgba(255, 255, 255, 0.48),
        inset -1px -1px 0 rgba(21, 49, 73, 0.14),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.16);
      transition: left 980ms var(--retake-slow-ease),
                  width 980ms var(--retake-slow-ease),
                  opacity 400ms linear 0ms;
      pointer-events: none;
    }

    .capsule {
      position: absolute;
      top: -1px;
      left: var(--cap-left, -5px);
      width: var(--cap-width, calc(20% + 5px));
      height: 72px;
      border-radius: 999px;
      background: rgba(246, 251, 255, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.28);
      -webkit-backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
      backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
      box-shadow:
        0 11px 28px rgba(4, 24, 43, 0.17),
        0 2px 6px rgba(4, 24, 43, 0.1),
        inset 1px 1px 0 rgba(255, 255, 255, 0.62),
        inset -1px -1px 0 rgba(20, 49, 73, 0.18),
        inset 0 0 12px rgba(255, 255, 255, 0.055);
      transition: left 620ms var(--retake-ease),
                  width 620ms var(--retake-ease),
                  background 980ms var(--retake-slow-ease);
      pointer-events: none;
    }

    /* Pseudo highlights */
    .track::before,
    .capsule::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(120% 150% at var(--glass-x, 24%) var(--glass-y, 8%),
                        rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0) 53%),
        linear-gradient(115deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0) 42%);
    }

    .track::after,
    .capsule::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      padding: 1px;
      background: conic-gradient(from 225deg, #7fe3ff, rgba(255, 255, 255, 0.35), #ffffff,
                                 #ffd7e6, rgba(255, 255, 255, 0.35), #7fe3ff);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
              mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .track::after { opacity: 0.27; }
    .capsule::after { opacity: 0.30; }

    /* Cells & Typography */
    .cells {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 2;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 0 14px;
      font-family: 'Manrope', system-ui, sans-serif;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.04em;
      white-space: nowrap;
      color: #fff;
      transition: opacity 420ms var(--retake-ease),
                  filter 420ms var(--retake-ease),
                  transform 980ms var(--retake-slow-ease);
      user-select: none;
    }

    .label-cell {
      cursor: default;
    }

    button.cell {
      background: transparent;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      outline: none;
    }

    .controller.dim-label .label-cell {
      opacity: 0.5;
      transition: opacity 300ms var(--retake-ease);
    }

    /* Collapsed / Selected State */
    .controller.collapsed .capsule {
      left: calc(50% - 100px);
      width: 200px;
      background: rgba(246, 251, 255, 0.14);
      transition: left 980ms var(--retake-slow-ease),
                  width 980ms var(--retake-slow-ease),
                  background 980ms var(--retake-slow-ease);
    }

    .controller.collapsed .track {
      left: calc(50% - 96px);
      width: 192px;
    }

    .controller.track-faded .track {
      opacity: 0;
      transition: opacity 400ms linear 650ms;
    }

    .cell.faded {
      opacity: 0 !important;
      filter: blur(10px);
      transform: scale(0.94);
      pointer-events: none;
    }

    .cell.traveling {
      z-index: 10;
      pointer-events: auto;
    }

    .cell.reset-mode {
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      animation: revealReset 520ms var(--retake-ease) forwards;
    }

    @keyframes revealReset {
      0% {
        opacity: 0;
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        filter: blur(0);
      }
    }

    /* ─── Header (z-index 30) ─── */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: calc(58px + env(safe-area-inset-top)) 40px 40px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
    }

    .brand-group {
      display: flex;
      align-items: center;
    }

    .logo-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      line-height: 0;
    }

    .logo-link svg {
      height: 24px;
      width: auto;
    }

    .meta {
      display: flex;
      align-items: center;
      margin-left: clamp(48px, 5vw, 70px);
      gap: clamp(28px, 3vw, 44px);
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: -0.04em;
      color: #fff;
    }

    .header-actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn-try {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 152px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      background: transparent;
      color: #fff;
      font-family: 'Manrope', system-ui, sans-serif;
      font-size: 18px;
      font-weight: 500;
      text-decoration: none;
      letter-spacing: -0.02em;
      transition: background 300ms ease, color 300ms ease, border-color 300ms ease;
    }

    .btn-try:hover,
    .btn-try:focus-visible {
      background: #ffffff;
      color: #0b1a26;
      border-color: #ffffff;
    }

    /* ─── Live Notice / Status (z-index 40) ─── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .error-notice {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      background: rgba(20, 10, 10, 0.85);
      border: 1px solid rgba(255, 100, 100, 0.4);
      border-radius: 999px;
      padding: 10px 24px;
      font-size: 14px;
      color: #ffb4b4;
      display: none;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .btn-retry {
      background: #fff;
      border: 0;
      color: #000;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ─── Responsive Media Queries ─── */
    @media (max-width: 900px) {
      .header {
        padding: calc(24px + env(safe-area-inset-top)) 24px 24px;
      }
      .meta {
        margin-left: 34px;
        gap: 22px;
        font-size: 14px;
      }
      .btn-try {
        width: 116px;
        height: 36px;
        font-size: 14px;
      }
      .cell {
        font-size: clamp(17px, 2.5vw, 24px);
      }
    }

    @media (max-width: 700px) {
      .header {
        padding-left: 18px;
        padding-right: 18px;
      }
      .logo-link svg {
        height: 21px;
      }
      .meta {
        font-size: 12px;
        margin-left: 20px;
        gap: 12px;
      }
      .meta-tagline {
        display: none;
      }
      .btn-try {
        width: 92px;
        height: 34px;
        font-size: 13px;
        position: relative;
      }
      .btn-try::after {
        content: '';
        position: absolute;
        inset: -6px -10px;
      }
      .hero-title {
        top: 34%;
        width: calc(100vw - 40px);
        font-size: clamp(48px, 14vw, 64px);
        line-height: 0.88;
        white-space: normal;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 16px;
      }
      .hero-desc {
        top: 77%;
        width: calc(100vw - 44px);
        font-size: 14px;
      }
      .controller {
        top: 53%;
        width: calc(100vw - 40px);
        height: 156px;
      }
      .track {
        top: 0;
        height: 156px;
        border-radius: 28px;
      }
      .cells {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: 48px 54px 54px;
      }
      .label-cell {
        grid-column: 1 / -1;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      .cell {
        font-size: 17px;
      }
      .cell:nth-child(2), .cell:nth-child(4) {
        border-right: 1px solid rgba(255, 255, 255, 0.12);
      }
      .cell:nth-child(2), .cell:nth-child(3) {
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      .capsule {
        opacity: 0;
        pointer-events: none;
      }
      .controller.collapsed .capsule {
        opacity: 1;
        left: 50%;
        top: 4vh;
        top: 4dvh;
        transform: translate(-50%, -50%);
        width: 196px;
        height: 64px;
        border-radius: 999px;
        background: rgba(246, 251, 255, 0.18);
      }
      button.cell:active,
      button.cell:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -3px;
      }
    }

    @media (max-width: 700px) and (max-height: 700px) {
      .controller {
        top: 50%;
      }
      .hero-desc {
        top: calc(50% + 168px);
        width: calc(100vw - 32px);
        font-size: 13px;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .hero-title {
        top: 20%;
        font-size: clamp(34px, 8vh, 56px);
      }
      .controller {
        top: 50%;
      }
      .hero-desc {
        top: auto;
        bottom: 8px;
        font-size: 13px;
      }
    }

    @media (max-width: 700px) and (max-height: 520px) and (orientation: landscape) {
      .hero-title {
        top: 12%;
        font-size: clamp(28px, 7vh, 44px);
      }
      .controller {
        top: 46%;
        height: 118px;
      }
      .track {
        height: 118px;
      }
      .cells {
        grid-template-rows: 36px 41px 41px;
      }
      .cell {
        font-size: 15px;
      }
      .hero-desc {
        bottom: 6px;
        font-size: 12px;
      }
    }

    /* ─── Reduced Motion ─── */
    @media (prefers-reduced-motion: reduce) {
      .capsule, .track, .cell, .hero-title span, .btn-try {
        transition-duration: 1ms !important;
        transition-delay: 0ms !important;
        filter: none !important;
      }
    }
  </style>
</head>
<body>

<div class="stage" id="stage">
  <!-- 8 Persistent Video Elements -->
  <div class="media-layer">
    <!-- Clothing (video-1) -->
    <video id="vid-clothing-fwd" class="media active" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid-clothing-rev" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

    <!-- Scene (video-2) -->
    <video id="vid-scene-fwd" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid-scene-rev" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

    <!-- Lighting (video-3) -->
    <video id="vid-lighting-fwd" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid-lighting-rev" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

    <!-- Cast (video-4) -->
    <video id="vid-cast-fwd" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video id="vid-cast-rev" class="media" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
  </div>

  <!-- Hero Copy -->
  <div class="hero">
    <h1 class="hero-title" id="heroTitle">
      <span>The</span>
      <span>world</span>
      <span>model</span>
    </h1>
    <p class="hero-desc">
      LTX builds open world models that give you full control, from production-grade video to systems that understand and operate in the physical world.
    </p>
  </div>

  <!-- Controller -->
  <div class="controller" id="controller" role="group" aria-label="Scene state controller">
    <div class="track" id="track"></div>
    <div class="capsule" id="capsule"></div>
    <div class="cells" id="cells">
      <div class="cell label-cell" id="labelState">Select state &rarr;</div>
      <button class="cell" id="btn-scene" data-target="scene" aria-label="Scene state">Scene</button>
      <button class="cell" id="btn-lighting" data-target="lighting" aria-label="Lighting state">Lighting</button>
      <button class="cell" id="btn-clothing" data-target="clothing" aria-label="Clothing state">Clothing</button>
      <button class="cell" id="btn-cast" data-target="cast" aria-label="Cast state">Cast</button>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="brand-group">
      <a href="https://app.ltx.io/" class="logo-link" aria-label="LTX home" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 75 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4h5.5v18.5H22V28H4V4z" fill="#ffffff"/>
          <path d="M26 4h18v5.5h-6.25V28h-5.5V9.5H26V4z" fill="#ffffff"/>
          <path d="M47.5 4h6.2l5.8 9.6L65.3 4h6.2l-8.9 14.1L72 28h-6.2l-6.3-10.2L53.2 28h-6.2l9.2-14.3L47.5 4z" fill="#ffffff"/>
        </svg>
      </a>
      <div class="meta">
        <span>LTX-2.5 is here</span>
        <span class="meta-tagline">Smarter. Faster</span>
      </div>
    </div>
    <div class="header-actions">
      <a href="https://app.ltx.io/" class="btn-try" target="_blank" rel="noopener noreferrer">Try now</a>
    </div>
  </header>

  <!-- Accessibility Live Region & Error Notice -->
  <div class="sr-only" role="status" aria-live="polite" id="liveStatus">Ready</div>
  <div class="error-notice" id="errorNotice">
    <span id="errorMessage">Playback error</span>
    <button class="btn-retry" id="btnRetry">Retry</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // Video Configuration
  var CLIPS = {
    clothing: {
      fwd: { id: 'vid-clothing-fwd', dur: 2.08, hold: 0.08 },
      rev: { id: 'vid-clothing-rev', dur: 2.08, hold: 0.08 },
      index: 3,
      name: 'Clothing'
    },
    scene: {
      fwd: { id: 'vid-scene-fwd', dur: 2.08, hold: 0.08 },
      rev: { id: 'vid-scene-rev', dur: 2.08, hold: 0.18 },
      index: 1,
      name: 'Scene'
    },
    lighting: {
      fwd: { id: 'vid-lighting-fwd', dur: 2.08, hold: 0.08 },
      rev: { id: 'vid-lighting-rev', dur: 2.04, hold: 0.08 },
      index: 2,
      name: 'Lighting'
    },
    cast: {
      fwd: { id: 'vid-cast-fwd', dur: 3.00, hold: 0.08 },
      rev: { id: 'vid-cast-rev', dur: 2.48, hold: 0.08 },
      index: 4,
      name: 'Cast'
    }
  };

  // State
  var state = {
    scene: 'base', // 'base' | 'scene' | 'lighting' | 'clothing' | 'cast'
    selectedBranch: null,
    isTransitioning: false,
    currentToken: 0,
    activeVideoId: 'vid-clothing-fwd',
    lastFocusedButton: null,
    retryAction: null
  };

  // DOM Elements
  var stage = document.getElementById('stage');
  var controller = document.getElementById('controller');
  var track = document.getElementById('track');
  var capsule = document.getElementById('capsule');
  var cells = document.getElementById('cells');
  var labelState = document.getElementById('labelState');
  var liveStatus = document.getElementById('liveStatus');
  var errorNotice = document.getElementById('errorNotice');
  var errorMessage = document.getElementById('errorMessage');
  var btnRetry = document.getElementById('btnRetry');

  var buttons = {
    scene: document.getElementById('btn-scene'),
    lighting: document.getElementById('btn-lighting'),
    clothing: document.getElementById('btn-clothing'),
    cast: document.getElementById('btn-cast')
  };

  var allButtons = [buttons.scene, buttons.lighting, buttons.clothing, buttons.cast];

  // Capsule positions lookup
  var CAPSULE_POSITIONS = {
    0: { left: '-5px', width: 'calc(20% + 5px)' },
    1: { left: '20%', width: '20%' },
    2: { left: '40%', width: '20%' },
    3: { left: '60%', width: '20%' },
    4: { left: '80%', width: 'calc(20% + 5px)' }
  };

  function setCapsulePos(index) {
    if (state.scene !== 'base' || state.isTransitioning) return;
    var pos = CAPSULE_POSITIONS[index] || CAPSULE_POSITIONS[0];
    controller.style.setProperty('--cap-left', pos.left);
    controller.style.setProperty('--cap-width', pos.width);
    if (index === 0) {
      controller.classList.remove('dim-label');
    } else {
      controller.classList.add('dim-label');
    }
  }

  function announce(msg) {
    if (liveStatus) {
      liveStatus.textContent = msg;
    }
  }

  function showError(msg, retryFn) {
    if (errorMessage) errorMessage.textContent = msg;
    if (errorNotice) errorNotice.style.display = 'inline-flex';
    state.retryAction = retryFn;
    announce('Error: ' + msg);
  }

  function hideError() {
    if (errorNotice) errorNotice.style.display = 'none';
    state.retryAction = null;
  }

  if (btnRetry) {
    btnRetry.addEventListener('click', function() {
      hideError();
      if (typeof state.retryAction === 'function') {
        state.retryAction();
      }
    });
  }

  // Pointer hover glass highlights
  controller.addEventListener('pointermove', function(e) {
    var rect = controller.getBoundingClientRect();
    var x = ((e.clientX - rect.left) / rect.width) * 100;
    var y = ((e.clientY - rect.top) / rect.height) * 100;
    controller.style.setProperty('--glass-x', x.toFixed(1) + '%');
    controller.style.setProperty('--glass-y', y.toFixed(1) + '%');
  });

  // Setup button hover/focus
  allButtons.forEach(function(btn) {
    var branchKey = btn.getAttribute('data-target');
    var index = CLIPS[branchKey].index;

    btn.addEventListener('pointerenter', function() {
      setCapsulePos(index);
    });

    btn.addEventListener('focus', function() {
      setCapsulePos(index);
    });

    btn.addEventListener('blur', function() {
      setTimeout(function() {
        var activeEl = document.activeElement;
        var hasButtonFocus = allButtons.some(function(b) { return b === activeEl; });
        if (!hasButtonFocus) {
          setCapsulePos(0);
        }
      }, 10);
    });
  });

  controller.addEventListener('pointerleave', function() {
    var activeEl = document.activeElement;
    var hasButtonFocus = allButtons.some(function(b) { return b === activeEl; });
    if (!hasButtonFocus) {
      setCapsulePos(0);
    }
  });

  // Base video initialization
  var baseVideo = document.getElementById('vid-clothing-fwd');
  if (baseVideo) {
    baseVideo.currentTime = 0;
    baseVideo.pause();
    baseVideo.classList.add('active');
  }

  // Preload & readiness tracker
  function checkMediaPairReady(branchKey) {
    var fwd = document.getElementById(CLIPS[branchKey].fwd.id);
    var rev = document.getElementById(CLIPS[branchKey].rev.id);
    return fwd && rev && fwd.readyState >= 2 && rev.readyState >= 2;
  }

  // Synchronous button locking
  function setButtonsDisabled(disabled) {
    allButtons.forEach(function(btn) {
      btn.disabled = disabled;
    });
  }

  // Decoded Frame detection using rVFC or fallback
  function waitForDecodedFrame(video, maxWaitMs) {
    return new Promise(function(resolve, reject) {
      var settled = false;
      var timer = null;

      function done(val) {
        if (settled) return;
        settled = true;
        if (timer) clearTimeout(timer);
        resolve(val);
      }

      function fail(err) {
        if (settled) return;
        settled = true;
        if (timer) clearTimeout(timer);
        reject(err);
      }

      timer = setTimeout(function() {
        fail(new Error('First-frame decode timeout'));
      }, maxWaitMs || 12000);

      if ('requestVideoFrameCallback' in video) {
        var callbackId = null;
        function onFrame(now, metadata) {
          if (metadata && metadata.mediaTime <= 0.5 && video.readyState >= 2) {
            done();
          } else {
            callbackId = video.requestVideoFrameCallback(onFrame);
          }
        }
        callbackId = video.requestVideoFrameCallback(onFrame);
      } else {
        function checkTicks() {
          if (video.readyState >= 2 && !video.paused) {
            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                done();
              });
            });
          } else {
            requestAnimationFrame(checkTicks);
          }
        }
        video.addEventListener('playing', function onPlay() {
          video.removeEventListener('playing', onPlay);
          checkTicks();
        });
      }
    });
  }

  // Core Transition Engine
  function playTransition(branchKey, direction) {
    if (state.isTransitioning) return;

    var token = ++state.currentToken;
    state.isTransitioning = true;
    hideError();

    // Capture focused button before disabling
    var focusedEl = document.activeElement;
    var heldFocus = allButtons.indexOf(focusedEl) !== -1;
    if (heldFocus) {
      state.lastFocusedButton = focusedEl;
    }

    // Synchronously lock input
    setButtonsDisabled(true);

    var isForward = direction === 'forward';
    var clipCfg = isForward ? CLIPS[branchKey].fwd : CLIPS[branchKey].rev;
    var targetVideo = document.getElementById(clipCfg.id);
    var oldActiveVideo = document.getElementById(state.activeVideoId);
    var targetBtn = buttons[branchKey];

    if (!targetVideo) {
      state.isTransitioning = false;
      setButtonsDisabled(false);
      return;
    }

    announce((isForward ? 'Switching to ' : 'Resetting from ') + CLIPS[branchKey].name);

    // Choreography: forward start
    if (isForward) {
      stage.classList.add('transitioning');
      controller.classList.add('collapsed');
      controller.classList.add('track-faded');

      // Hide other labels
      allButtons.forEach(function(btn) {
        if (btn !== targetBtn) {
          btn.classList.add('faded');
          btn.setAttribute('tabindex', '-1');
          btn.setAttribute('aria-hidden', 'true');
        }
      });
      labelState.classList.add('faded');

      // Calculate travel transform to center
      var targetCenter = targetBtn.getBoundingClientRect();
      var cellsCenter = cells.getBoundingClientRect();
      var dx = (cellsCenter.left + cellsCenter.width / 2) - (targetCenter.left + targetCenter.width / 2);
      var dy = (cellsCenter.top + cellsCenter.height / 2) - (targetCenter.top + targetCenter.height / 2);

      targetBtn.classList.add('traveling');
      targetBtn.style.transform = 'translate(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px)';

      // Title hide delay (~12% of duration, max 0.9s)
      var titleHideDelay = Math.min(clipCfg.dur * 0.12, 0.9) * 1000;
      setTimeout(function() {
        if (state.currentToken === token) {
          stage.classList.add('title-hidden');
        }
      }, titleHideDelay);
    } else {
      // Reverse start: expand bar in parallel with reverse playback
      controller.classList.remove('collapsed');
      controller.classList.remove('track-faded');

      targetBtn.classList.remove('reset-mode');
      targetBtn.style.transform = 'translate(0px, 0px)';
      targetBtn.textContent = CLIPS[branchKey].name;

      setTimeout(function() {
        if (state.currentToken === token) {
          allButtons.forEach(function(btn) {
            btn.classList.remove('faded');
          });
          labelState.classList.remove('faded');
        }
      }, 60);

      setCapsulePos(0);
    }

    // Rewind hidden target video to 0
    targetVideo.currentTime = 0;
    targetVideo.pause();

    var playPromise = targetVideo.play();
    var framePromise = waitForDecodedFrame(targetVideo, 12000);

    Promise.all([playPromise, framePromise]).then(function() {
      if (state.currentToken !== token) return;

      // Switch visibility atomically
      if (oldActiveVideo && oldActiveVideo !== targetVideo) {
        oldActiveVideo.classList.remove('active');
        oldActiveVideo.pause();
      }
      targetVideo.classList.add('active');
      state.activeVideoId = clipCfg.id;

      // Monitor playback terminal hold
      var duration = clipCfg.dur || targetVideo.duration || 2.08;
      var holdOffset = clipCfg.hold || 0.08;
      var holdTime = Math.max(0, duration - holdOffset);

      var animFrameId = null;
      var endedHandler = null;

      function commitTerminal() {
        if (state.currentToken !== token) return;
        if (animFrameId) cancelAnimationFrame(animFrameId);
        if (endedHandler) targetVideo.removeEventListener('ended', endedHandler);

        targetVideo.pause();

        if (isForward) {
          state.scene = branchKey;
          state.selectedBranch = branchKey;
          state.isTransitioning = false;

          // Transform button to Reset
          targetBtn.disabled = false;
          targetBtn.textContent = 'Reset';
          targetBtn.classList.add('reset-mode');
          targetBtn.setAttribute('aria-label', 'Reset to base scene');

          if (heldFocus || state.lastFocusedButton === targetBtn) {
            targetBtn.focus({ preventScroll: true });
          }

          announce(CLIPS[branchKey].name + ' selected. Press Reset to return.');
        } else {
          state.scene = 'base';
          state.selectedBranch = null;
          state.isTransitioning = false;

          targetBtn.classList.remove('traveling');
          targetBtn.style.transform = '';

          allButtons.forEach(function(btn) {
            btn.disabled = false;
            btn.removeAttribute('tabindex');
            btn.removeAttribute('aria-hidden');
            var key = btn.getAttribute('data-target');
            btn.textContent = CLIPS[key].name;
            btn.setAttribute('aria-label', CLIPS[key].name + ' state');
          });

          stage.classList.remove('transitioning');
          stage.classList.remove('title-hidden');

          if (state.lastFocusedButton) {
            state.lastFocusedButton.focus({ preventScroll: true });
          }

          announce('Returned to base scene');
        }
      }

      function checkProgress() {
        if (state.currentToken !== token) return;
        if (targetVideo.currentTime >= holdTime) {
          commitTerminal();
        } else {
          animFrameId = requestAnimationFrame(checkProgress);
        }
      }

      endedHandler = function() {
        commitTerminal();
      };

      targetVideo.addEventListener('ended', endedHandler, { once: true });
      animFrameId = requestAnimationFrame(checkProgress);

    }).catch(function(err) {
      if (state.currentToken !== token) return;
      console.error('Transition failed:', err);
      state.isTransitioning = false;
      setButtonsDisabled(false);

      showError('Failed to load scene transition', function() {
        playTransition(branchKey, direction);
      });
    });
  }

  // Button Click Handlers
  allButtons.forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      var branchKey = btn.getAttribute('data-target');

      if (state.isTransitioning) return;

      if (state.scene === 'base') {
        playTransition(branchKey, 'forward');
      } else if (state.scene === branchKey && state.selectedBranch === branchKey) {
        playTransition(branchKey, 'reverse');
      }
    });
  });

  // Visibility Change / Background Tab Guard
  document.addEventListener('visibilitychange', function() {
    var activeVid = document.getElementById(state.activeVideoId);
    if (document.hidden) {
      if (activeVid && !activeVid.paused) {
        activeVid.pause();
      }
    }
  });

  // Initial announcement
  announce('LTX world model ready. 4 state controls available.');

})();
</script>
</body>
</html>
